services:
  app:
    image: php:8.4-cli
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    command: >
      sh -c "
      php artisan serve --host=0.0.0.0 --port=8000
      "
    networks:
      - laravel_net

  vite:
    image: node:22
    container_name: laravel_vite
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: >
      sh -c "
      npm install && npm run dev -- --host 0.0.0.0 --port 5173 --origin http://localhost:5173
      "
    networks:
      - laravel_net

  composer:
    image: composer:latest
    container_name: laravel_composer
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel_net

networks:
  laravel_net:
